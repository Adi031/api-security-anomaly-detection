version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: anomaly-detection-db
    environment:
      POSTGRES_DB: api_security
      POSTGRES_USER: anomaly_user
      POSTGRES_PASSWORD: anomaly_pass_2024
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anomaly_user -d api_security"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
